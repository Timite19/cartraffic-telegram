	<style>
		/* Telegram optimizations */
		body {
			margin: 0;
			padding: 0;
			background-color: var(--tg-color-bg, #000);
		}
		canvas {
			display: block;
			width: 100%;
			height: 100vh;
		}
	</style>

<body>

	

<script>
// Initialiser Telegram WebApp
if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
	const tg = window.Telegram.WebApp;
	tg.ready();
	tg.expand();
	
	// Récupérer les infos utilisateur
	const user = tg.initDataUnsafe?.user;
	if (user) {
		console.log('✅ Telegram User:', user.id, user.first_name);
		window.telegramUser = user;
	}
	
	// Activer le bouton de fermeture
	tg.enableClosingConfirmation();
}

// Vérification de développement
if (location.protocol.substr(0, 4) === "file")
{
	alert("Web exports won't work until you upload them. (When running on the file: protocol, browsers block many features from working for security reasons.)");
}
</script>

		<div id="notSupportedWrap">
			<h2 id="notSupportedTitle">This content requires JavaScript</h2>

		</div>

	<script src="scripts/modernjscheck.js"></script>

	<script src="scripts/main.js" type="module"></script>

	<!-- Telegram Game Integration -->
	<script>
		// Save player score to localStorage
		window.saveGameScore = function(levelNumber, score) {
			try {
				const gameData = {
					lastLevel: levelNumber,
					lastScore: score,
					timestamp: new Date().toISOString()
				};
				
				// Sauvegarder localement
				localStorage.setItem('carTrafficGameData', JSON.stringify(gameData));
				
				// Si Telegram est disponible
				if (window.telegramUser) {
					console.log('📊 Score saved:', score, 'Level:', levelNumber);
				}
			} catch (e) {
				console.error('Error saving score:', e);
			}
		};
		
		// Load saved game data
		window.loadGameScore = function() {
			try {
				const data = localStorage.getItem('carTrafficGameData');
				return data ? JSON.parse(data) : null;
			} catch (e) {
				return null;
			}
		};
		
		// Show Telegram alert (if available)
		window.showTelegramAlert = function(message) {
			if (window.Telegram?.WebApp) {
				window.Telegram.WebApp.showAlert(message);
			} else {
				alert(message);
			}
		};
	</script>

</body>
